name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes do motor de jogo
        run: npm run test --workspace=packages/game-core

      - name: Build do motor de jogo
        run: npm run build --workspace=packages/game-core

      - name: Prisma generate
        run: npm run prisma:generate --workspace=apps/api

      - name: Typecheck da API
        run: npm run typecheck --workspace=apps/api

      - name: Build da API
        run: npm run build --workspace=apps/api

      - name: Build do frontend
        run: npm run build --workspace=apps/web

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens Docker
        run: |
          docker build -f apps/api/Dockerfile -t truco-api .
          docker build -f apps/web/Dockerfile -t truco-web .
      # TODO deploy: push para o registry (ECR/GAR/Docker Hub) e
      # atualizar o serviço (ECS/Cloud Run/Fly.io/k8s) conforme o provedor.
